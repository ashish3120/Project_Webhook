spring:
  application:
    name: webhook-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webhookdb}
    username: ${SPRING_DATASOURCE_USERNAME:webhook}
    password: ${SPRING_DATASOURCE_PASSWORD:webhooksecret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  jackson:
    default-property-inclusion: NON_NULL

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

webhook:
  worker:
    lease-duration-seconds: ${WEBHOOK_WORKER_LEASE_DURATION_SECONDS:60}
    batch-size: ${WEBHOOK_WORKER_BATCH_SIZE:10}
    poll-interval-ms: ${WEBHOOK_WORKER_POLL_INTERVAL_MS:5000}
    thread-pool-size: ${WEBHOOK_WORKER_THREAD_POOL_SIZE:5}
  retry:
    max-attempts: ${WEBHOOK_RETRY_MAX_ATTEMPTS:8}
    base-delay-ms: ${WEBHOOK_RETRY_BASE_DELAY_MS:5000}
    max-delay-ms: ${WEBHOOK_RETRY_MAX_DELAY_MS:3600000}
    jitter-factor: ${WEBHOOK_RETRY_JITTER_FACTOR:0.25}
  client:
    connect-timeout-ms: ${WEBHOOK_CLIENT_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${WEBHOOK_CLIENT_READ_TIMEOUT_MS:10000}
  allow-internal-endpoints: ${WEBHOOK_ALLOW_INTERNAL_ENDPOINTS:false}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException.InternalServerError


logging:
  level:
    com.example.webhook: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
